                            <div class="p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs space-y-1">
                                <span class="font-bold text-emerald-400">${treat.name}</span>
                                <p class="text-slate-300 font-mono text-[11px]">${treat.result}</p>
                            </div>
                        `;
                        playTone(1046, 'square');
                    }
                };
                container.appendChild(btn);
            });
        }

        function setupCaseDdxDropdown(activeCase) {
            const select = document.getElementById('case-ddx-select');
            select.innerHTML = '';
            activeCase.ddxOptions.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.id;
                el.innerText = opt.name;
                select.appendChild(el);
            });
        }

        function addCaseDifferential() {
            const select = document.getElementById('case-ddx-select');
            const val = select.value;
            if (!val || state.activeCaseDdx.includes(val)) return;

            state.activeCaseDdx.push(val);
            const matrix = document.getElementById('case-ddx-matrix');
            if (state.activeCaseDdx.length === 1) matrix.innerHTML = '';

            const activeCase = (state.track === 'human') ? CASE_DATABASE.human : (CASE_DATABASE.vet[state.vetSpecies] || CASE_DATABASE.vet['Canine']);
            const optionObj = activeCase.ddxOptions.find(o => o.id === val);

            matrix.innerHTML += `
                <div class="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs flex justify-between items-center">
                    <span class="font-bold text-amber-300">${optionObj.name}</span>
                    <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded">Active Differential</span>
                </div>
            `;
            playTone(659, 'triangle');
        }

        function commitCaseDiagnosis() {
            let activeCase = (state.track === 'human') ? CASE_DATABASE.human : (CASE_DATABASE.vet[state.vetSpecies] || CASE_DATABASE.vet['Canine']);
            
            if (state.activeCaseDdx.includes(activeCase.targetDdx)) {
                addXP(100);
                alert(`🎉 CLINICAL SUCCESS!\n\nCorrect primary diagnosis submitted: ${activeCase.targetDdx}.\nYou awarded +100 XP.`);
                playTone(1200, 'sine', 0.3);
            } else {
                alert(`⚠️ CASE EVALUATION\n\nYour working differential list did not include the targeted primary pathology (${activeCase.targetDdx}). Review clinical diagnostics.`);
                playTone(300, 'sawtooth', 0.3);
            }
        }

        /* QUIZ ENGINE */
        function loadQuizQuestion() {
            const list = QUIZ_DATABASE[state.track];
            const q = list[state.currentQuizIndex % list.length];

            document.getElementById('quiz-subject-tag').innerText = q.subject;
            document.getElementById('quiz-question-text').innerText = q.question;
            document.getElementById('quiz-question-counter').innerText = `Question ${(state.currentQuizIndex % list.length) + 1} / ${list.length}`;

            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('quiz-rationale-box').classList.add('hidden');
            document.getElementById('btn-quiz-next').classList.add('hidden');

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-sky-500/50 text-xs font-medium text-slate-200 transition flex items-center justify-between";
                btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-slate-600"></i>`;
                btn.onclick = () => selectQuizOption(idx, q.correct, q.rationale);
                optionsContainer.appendChild(btn);
            });
        }

        function selectQuizOption(selectedIdx, correctIdx, rationale) {
            const container = document.getElementById('quiz-options-container');
            const buttons = container.querySelectorAll('button');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correctIdx) {
                    btn.className = "w-full text-left p-3 rounded-xl bg-emerald-950/80 border border-emerald-500 text-xs font-medium text-emerald-200 transition flex items-center justify-between";
                    btn.innerHTML += `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
                } else if (idx === selectedIdx) {
                    btn.className = "w-full text-left p-3 rounded-xl bg-rose-950/80 border border-rose-500 text-xs font-medium text-rose-200 transition flex items-center justify-between";
                    btn.innerHTML += `<i class="fa-solid fa-circle-xmark text-rose-400"></i>`;
                }
            });

            const ratBox = document.getElementById('quiz-rationale-box');
            const ratHeader = document.getElementById('quiz-rationale-header');
            const ratText = document.getElementById('quiz-rationale-text');

            ratBox.classList.remove('hidden');
            if (selectedIdx === correctIdx) {
                ratHeader.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-check mr-1"></i> CORRECT ANSWER (+25 XP)</span>`;
                addXP(25);
                playTone(987, 'sine', 0.2);
            } else {
                ratHeader.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-xmark mr-1"></i> INCORRECT</span>`;
                playTone(350, 'sawtooth', 0.2);
            }

            ratText.innerText = rationale;
            document.getElementById('btn-quiz-next').classList.remove('hidden');
        }

        function nextQuizQuestion() {
            state.currentQuizIndex++;
            loadQuizQuestion();
        }

        /* VISUAL LAB ENGINE */
        function loadVisLabSlide() {
            const slide = VISLAB_SLIDES[0];
            document.getElementById('vislab-viewport').innerHTML = slide.svg;
            document.getElementById('vislab-slide-title').innerText = slide.title;
            document.getElementById('vislab-slide-desc').innerText = slide.desc;

            const container = document.getElementById('vislab-options-container');
            container.innerHTML = '';
            slide.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-2.5 rounded-lg bg-slate-950 border border-slate-800 hover:border-emerald-500/50 text-xs text-slate-200 font-medium transition";
                btn.innerText = opt;
                btn.onclick = () => {
                    const fb = document.getElementById('vislab-feedback');
                    fb.classList.remove('hidden');
                    if (idx === slide.correct) {
                        fb.className = "text-xs p-2.5 rounded-lg bg-emerald-950 border border-emerald-800 text-emerald-300 font-bold";
                        fb.innerText = "Correct Identification! Podocytes wrap around glomerular capillaries.";
                        addXP(30);
                        playTone(1046, 'sine');
                    } else {
                        fb.className = "text-xs p-2.5 rounded-lg bg-rose-950 border border-rose-800 text-rose-300 font-bold";
                        fb.innerText = "Incorrect. Re-examine histological cell markers.";
                        playTone(300, 'triangle');
                    }
                };
                container.appendChild(btn);
            });
        }

        /* GAMIFICATION (XP & LEVEL) */
        function addXP(amount) {
            state.xp += amount;
            if (state.xp >= 500) {
                state.level++;
                state.xp -= 500;
                playTone(1318, 'sine', 0.4);
                alert(`🌟 LEVEL UP! You reached Level ${state.level}!`);
            }
            document.getElementById('user-level').innerText = state.level;
            document.getElementById('user-xp-text').innerText = `${state.xp}/500 XP`;
            document.getElementById('user-xp-bar').style.width = `${(state.xp / 500) * 100}%`;
        }

        /* THEME TOGGLE */
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-sun text-amber-400 text-xs";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-moon text-xs";
            }
        }
    </script>
</body>
</html>

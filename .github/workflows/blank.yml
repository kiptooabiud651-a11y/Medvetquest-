```html
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVet Quest & Clinical Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        med: { 500: '#0284c7', 600: '#0369a1', 700: '#075985', 900: '#0f172a' },
                        vet: { 500: '#059669', 600: '#047857', 700: '#065f46', 900: '#064e3b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .font-mono-vital { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
        .telemetry-grid {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        }
        @keyframes pulse-heart {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .heart-beat { animation: pulse-heart 1.2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- TOP NAV BAR -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-2.5 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- Logo & Track Indicator -->
            <div class="flex items-center space-x-3">
                <div id="track-logo-badge" class="bg-sky-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md">
                    <i id="track-logo-icon" class="fa-solid fa-user-doctor text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white flex items-center gap-2">
                        MedVet Quest
                        <span id="track-pill" class="text-[10px] bg-sky-500/20 text-sky-400 border border-sky-500/30 px-2 py-0.5 rounded-full font-mono font-semibold uppercase">HUMAN MEDICINE TRACK</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">Clinical Education & Gamified Board Review</p>
                </div>
            </div>

            <!-- Stats Header (XP, Level, Streak) & Track Selector -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                
                <!-- Track Switcher -->
                <div class="bg-slate-950 p-1 rounded-lg border border-slate-800 flex text-xs">
                    <button id="btn-track-human" onclick="setTrack('human')" class="px-3 py-1.5 rounded-md font-semibold text-white bg-sky-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-user-stethoscope"></i> <span class="hidden sm:inline">Human (MD)</span>
                    </button>
                    <button id="btn-track-vet" onclick="setTrack('vet')" class="px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-paw"></i> <span class="hidden sm:inline">Vet (DVM)</span>
                    </button>
                </div>

                <!-- User Level & XP Bar -->
                <div class="hidden md:flex items-center bg-slate-800/80 border border-slate-700/80 rounded-lg px-3 py-1.5 space-x-3 text-xs">
                    <div class="flex items-center space-x-1.5 text-amber-400 font-bold">
                        <i class="fa-solid fa-trophy"></i>
                        <span>Lvl <span id="user-level">1</span></span>
                    </div>
                    <div class="w-24 bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                        <div id="user-xp-bar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-full w-[20%] transition-all duration-300"></div>
                    </div>
                    <span id="user-xp-text" class="text-[10px] text-slate-400 font-mono">120/500 XP</span>
                </div>

                <!-- Streak Counter -->
                <div class="flex items-center bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1.5 rounded-lg font-bold space-x-1">
                    <i class="fa-solid fa-fire text-amber-500"></i>
                    <span id="user-streak">1 Day Streak</span>
                </div>

                <!-- User Profile Modal Trigger -->
                <button onclick="openProfileModal()" class="text-slate-300 hover:text-white bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-user-gear text-sky-400"></i>
                    <span class="hidden sm:inline">Profile</span>
                </button>

                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="text-slate-400 hover:text-white p-2 rounded-lg border border-slate-800 hover:bg-slate-800 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- PWA INSTALLATION BANNER -->
    <div id="pwa-install-banner" class="hidden bg-gradient-to-r from-sky-900 via-slate-900 to-emerald-900 border-b border-sky-500/30 px-4 py-2 text-xs flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-mobile-screen-button text-sky-400 text-sm"></i>
            <span>Install <strong>MedVet Quest</strong> on your home screen for offline clinical practice!</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-pwa-install" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-3 py-1 rounded text-xs transition">Install App</button>
            <button onclick="dismissPWAInstall()" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="text-slate-400 hover:text-white p-2 rounded-lg border border-slate-800 hover:bg-slate-800 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP WRAPPER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col gap-4">

        <!-- NAV TABS FOR MODES -->
        <nav class="bg-slate-900 border border-slate-800 rounded-xl p-1.5 flex items-center justify-between overflow-x-auto shadow-sm">
            <div class="flex space-x-1 min-w-max">
                <button id="nav-mode-curriculum" onclick="switchMode('curriculum')" class="px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 bg-sky-600 text-white shadow-sm transition">
                    <i class="fa-solid fa-book-bookmark"></i> Course Curriculum
                </button>
                <button id="nav-mode-cases" onclick="switchMode('cases')" class="px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-hospital-user"></i> Clinical Simulator
                </button>
                <button id="nav-mode-quiz" onclick="switchMode('quiz')" class="px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-brain"></i> Mastery Quiz
                </button>
                <button id="nav-mode-vislab" onclick="switchMode('vislab')" class="px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-microscope"></i> Visual & Anatomic Lab
                </button>
            </div>

            <!-- Species Selector Badge (For Vet Mode) -->
            <div id="species-selector-wrapper" class="hidden items-center gap-1 text-xs pl-2">
                <span class="text-slate-400 text-[11px] font-mono">Species:</span>
                <select id="species-select" onchange="changeVetSpecies(this.value)" class="bg-slate-950 border border-slate-700 text-emerald-400 text-xs rounded-lg px-2 py-1 font-semibold focus:outline-none">
                    <option value="Canine">Canine 🐶</option>
                    <option value="Feline">Feline 🐱</option>
                    <option value="Equine">Equine 🐴</option>
                    <option value="Bovine">Bovine 🐮</option>
                    <option value="Avian">Avian 🦜</option>
                </select>
            </div>
        </nav>

        <!-- MODE 1: COURSE CURRICULUM HUB -->
        <section id="view-curriculum" class="space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 mb-4 gap-3">
                    <div>
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-graduation-cap text-sky-400"></i> Core Medical & Veterinary Disciplines
                        </h2>
                        <p class="text-xs text-slate-400">Select a course module to review high-yield concepts, board review notes, and anatomical breakdowns.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-400">Total Disciplines: <strong class="text-sky-400">6 Modules</strong></span>
                    </div>
                </div>

                <!-- Disciplines Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="disciplines-grid">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </section>

        <!-- MODE 2: CLINICAL SIMULATOR (CASES) -->
        <section id="view-cases" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Left Panel: Patient Card & Telemetry (4 Cols) -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                
                <!-- Patient Info Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm relative overflow-hidden">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span id="case-species-tag" class="text-[10px] font-mono uppercase tracking-wider text-sky-400 bg-sky-950 border border-sky-800 px-2 py-0.5 rounded font-bold">HUMAN PATIENT</span>
                            <h2 id="case-pt-name" class="text-lg font-bold text-slate-100 mt-1">Robert Vance</h2>
                            <p id="case-pt-demo" class="text-xs text-slate-400">64 yo Male • MRN: #994-012</p>
                        </div>
                        <span id="case-stability-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> STABLE
                        </span>
                    </div>

                    <div class="border-t border-slate-800/80 pt-3 mt-2 text-xs space-y-1.5">
                        <div class="flex justify-between text-slate-300">
                            <span class="text-slate-400">Chief Complaint:</span>
                            <span id="case-pt-cc" class="font-semibold text-amber-300 text-right">"Crushing chest pressure"</span>
                        </div>
                        <div class="flex justify-between text-slate-300">
                            <span class="text-slate-400">Allergies:</span>
                            <span id="case-pt-allergies" class="font-medium text-slate-200">Penicillin</span>
                        </div>
                    </div>
                </div>

                <!-- Live Vitals Telemetry Box -->
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 telemetry-grid relative">
                    <div class="flex items-center justify-between border-b border-slate-800/80 pb-2 mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></div>
                            <h3 class="text-xs font-mono font-bold tracking-wider text-emerald-400 uppercase">Live Telemetry</h3>
                        </div>
                        <span class="text-[10px] font-mono text-slate-500">ECG LEAD II</span>
                    </div>

                    <div class="w-full h-10 mb-3 bg-slate-900/60 rounded border border-slate-800/50 overflow-hidden relative flex items-center">
                        <svg class="w-full h-full text-emerald-500 opacity-80" viewBox="0 0 500 50" preserveAspectRatio="none">
                            <path d="M 0,25 Q 20,25 40,25 T 80,25 L 90,10 L 98,42 L 106,5 L 115,30 L 125,25 T 180,25 Q 200,25 220,25 T 260,25 L 270,12 L 278,40 L 286,8 L 295,28 L 305,25 T 360,25 Q 380,25 400,25 L 410,10 L 418,42 L 426,5 L 435,30 L 445,25 T 500,25" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </div>

                    <!-- Vitals Grid -->
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-lg flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-mono text-slate-400 block font-bold">HR</span>
                                <span id="v-hr" class="text-xl font-bold font-mono-vital text-emerald-400">98</span> <span class="text-[9px] text-slate-500">BPM</span>
                            </div>
                            <i class="fa-solid fa-heartbeat text-emerald-500/40 text-lg heart-beat"></i>
                        </div>

                        <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-lg flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-mono text-slate-400 block font-bold">BP</span>
                                <span id="v-bp" class="text-lg font-bold font-mono-vital text-cyan-400">142/88</span> <span class="text-[9px] text-slate-500">mmHg</span>
                            </div>
                            <i class="fa-solid fa-gauge-high text-cyan-500/40 text-lg"></i>
                        </div>

                        <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-lg flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-mono text-slate-400 block font-bold">SpO2</span>
                                <span id="v-spo2" class="text-xl font-bold font-mono-vital text-sky-400">95%</span>
                            </div>
                            <i class="fa-solid fa-lungs text-sky-500/40 text-lg"></i>
                        </div>

                        <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-lg flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-mono text-slate-400 block font-bold">RESP</span>
                                <span id="v-rr" class="text-xl font-bold font-mono-vital text-amber-400">22</span> <span class="text-[9px] text-slate-500">/min</span>
                            </div>
                            <i class="fa-solid fa-wind text-amber-500/40 text-lg"></i>
                        </div>
                    </div>
                </div>

                <!-- Case History Tabs -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col min-h-[220px]">
                    <div class="flex border-b border-slate-800 mb-3 space-x-2">
                        <button id="case-tab-hpi" onclick="setCaseHistoryTab('hpi')" class="px-3 py-1 text-xs font-semibold border-b-2 border-sky-500 text-sky-400">HPI History</button>
                        <button id="case-tab-exam" onclick="setCaseHistoryTab('exam')" class="px-3 py-1 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">Physical Exam</button>
                    </div>
                    <div id="case-history-body" class="text-xs leading-relaxed text-slate-300 overflow-y-auto flex-1 pr-1">
                        <!-- Dynamic text -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: Diagnostics, Treatments, Differential Matrix (8 Cols) -->
            <div class="lg:col-span-8 flex flex-col gap-4">
                
                <!-- Action Workspace Header & Submit -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center flex-wrap gap-2">
                    <div class="flex space-x-2">
                        <button id="case-btn-diag" onclick="setCaseSubPanel('diag')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white">Diagnostics</button>
                        <button id="case-btn-treat" onclick="setCaseSubPanel('treat')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Interventions</button>
                        <button id="case-btn-ddx" onclick="setCaseSubPanel('ddx')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Differential Builder</button>
                    </div>

                    <button onclick="commitCaseDiagnosis()" class="bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1.5">
                        <i class="fa-solid fa-flag-checkered"></i> Submit Final Diagnosis
                    </button>
                </div>

                <!-- SUB-PANEL: DIAGNOSTICS -->
                <div id="case-subpanel-diag" class="space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                        <h3 class="text-xs font-bold uppercase text-slate-400 mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-vial text-sky-400"></i> Order Lab Tests & Imaging
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="case-diag-buttons">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Diagnostic Results Log -->
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 min-h-[260px] flex flex-col">
                        <h3 class="text-xs font-bold uppercase text-slate-300 border-b border-slate-800 pb-2 mb-3">Diagnostic Results Log</h3>
                        <div id="case-diag-results" class="space-y-2 overflow-y-auto flex-1 pr-1">
                            <p class="text-xs text-slate-500 text-center py-8">No tests ordered yet.</p>
                        </div>
                    </div>
                </div>

                <!-- SUB-PANEL: TREATMENTS -->
                <div id="case-subpanel-treat" class="hidden space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                        <h3 class="text-xs font-bold uppercase text-slate-400 mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-syringe text-emerald-400"></i> Administer Emergency Interventions
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="case-treat-buttons">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Treatment Log -->
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 min-h-[260px] flex flex-col">
                        <h3 class="text-xs font-bold uppercase text-slate-300 border-b border-slate-800 pb-2 mb-3">Intervention History</h3>
                        <div id="case-treat-results" class="space-y-2 overflow-y-auto flex-1 pr-1">
                            <p class="text-xs text-slate-500 text-center py-8">No treatments administered yet.</p>
                        </div>
                    </div>
                </div>

                <!-- SUB-PANEL: DIFFERENTIAL MATRIX -->
                <div id="case-subpanel-ddx" class="hidden space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                        <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Build Differential Diagnosis</h3>
                        <div class="flex gap-2">
                            <select id="case-ddx-select" class="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 flex-1 focus:outline-none">
                                <!-- Dynamic options -->
                            </select>
                            <button onclick="addCaseDifferential()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Add to Working List</button>
                        </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 min-h-[260px] flex flex-col">
                        <h3 class="text-xs font-bold uppercase text-slate-300 border-b border-slate-800 pb-2 mb-3">Clinical Evidence Matrix</h3>
                        <div id="case-ddx-matrix" class="space-y-3 overflow-y-auto flex-1 pr-1">
                            <p class="text-xs text-slate-500 text-center py-8">No differentials added to workspace.</p>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- MODE 3: COURSE MASTERY QUIZ -->
        <section id="view-quiz" class="hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm max-w-3xl mx-auto space-y-4">
                
                <!-- Quiz Progress Bar & Header -->
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                        <span id="quiz-subject-tag" class="text-[10px] font-mono text-sky-400 font-bold uppercase">ANATOMY & PHYSIOLOGY</span>
                        <h2 class="text-lg font-bold text-white">Board Review Mastery Quiz</h2>
                    </div>
                    <div class="text-right">
                        <span id="quiz-question-counter" class="text-xs font-mono text-slate-400">Question 1 / 5</span>
                    </div>
                </div>

                <!-- Question Box -->
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <p id="quiz-question-text" class="text-sm text-slate-200 font-medium leading-relaxed">
                        Question text will load here...
                    </p>
                </div>

                <!-- Answer Options -->
                <div class="space-y-2.5" id="quiz-options-container">
                    <!-- Populated dynamically -->
                </div>

                <!-- Explanation Rationale Box -->
                <div id="quiz-rationale-box" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2">
                    <div id="quiz-rationale-header" class="text-xs font-bold uppercase flex items-center gap-1.5">
                        <!-- Correct/Incorrect badge -->
                    </div>
                    <p id="quiz-rationale-text" class="text-xs text-slate-300 leading-relaxed font-sans">
                        Rationale text...
                    </p>
                </div>

                <!-- Action Button -->
                <div class="flex justify-end pt-2">
                    <button id="btn-quiz-next" onclick="nextQuizQuestion()" class="hidden bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-5 py-2.5 rounded-lg transition">
                        Next Question &rarr;
                    </button>
                </div>
            </div>
        </section>

        <!-- MODE 4: VISUAL & MICROSCOPIC LAB -->
        <section id="view-vislab" class="hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm max-w-4xl mx-auto space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                        <span class="text-[10px] font-mono text-emerald-400 font-bold uppercase">HISTOPATHOLOGY & ANATOMY IDENTIFIER</span>
                        <h2 class="text-lg font-bold text-white">Interactive Visual Slide Lab</h2>
                    </div>
                    <span id="vislab-score-display" class="text-xs font-mono text-amber-400">Score: 0 / 100</span>

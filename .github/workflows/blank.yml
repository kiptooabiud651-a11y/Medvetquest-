        /* PWA REGISTRATION & MANIFEST GENERATOR */
        let deferredPrompt;
        function registerPWA() {
            // Dynamically generate web manifest
            const manifest = {
                name: "MedVet Quest & Clinical Academy",
                short_name: "MedVetQuest",
                start_url: "./",
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#0284c7",
                icons: [{
                    src: "https://placehold.co/192x192/0284c7/ffffff?text=MedVet",
                    sizes: "192x192",
                    type: "image/png"
                }, {
                    src: "https://placehold.co/512x512/0284c7/ffffff?text=MedVet",
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            // Register inline service worker
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                `;
                const swBlob = new Blob([swCode], {type: 'text/javascript'});
                const swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL).catch(err => console.log('SW registration note:', err));
            }

            // Capture install prompt
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('pwa-install-banner').classList.remove('hidden');
            });

            document.getElementById('btn-pwa-install').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const choice = await deferredPrompt.userChoice;
                    if (choice.outcome === 'accepted') {
                        document.getElementById('pwa-install-banner').classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }

        function dismissPWAInstall() {
            document.getElementById('pwa-install-banner').classList.add('hidden');
        }

        /* ... remaining logic functions ... */

            document.getElementById(`case-subpanel-${panel}`).classList.remove('hidden');
            document.getElementById(`case-btn-${panel}`).className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white";

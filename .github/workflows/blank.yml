    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP & FIREBASE INITIALIZATION
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'medvet-quest-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456",
            appId: "1:123456:web:123456"
        };

        let app, db, auth;
        let currentUser = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // AUTHENTICATION FLOW
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };

            initAuth();

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    window.currentUser = user;
                    document.getElementById('user-id-display').innerText = `ID: ${user.uid}`;
                    await loadUserProfileFromCloud();
                }
            });
        } catch (e) {
            console.log("Firebase initialized in standalone/offline mode.");
        }

        // CLOUD PERSISTENCE FUNCTIONS
        window.saveUserProfileToCloud = async function() {
            if (!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'userdata');
                await setDoc(userDocRef, {
                    level: window.state.level,
                    xp: window.state.xp,
                    streak: window.state.streak,
                    track: window.state.track,
                    vetSpecies: window.state.vetSpecies,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                document.getElementById('profile-sync-status').innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Synced`;
            } catch (err) {
                console.error("Cloud save failed", err);
            }
        };

        window.loadUserProfileFromCloud = async function() {
            if (!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'userdata');
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.level) window.state.level = data.level;
                    if (data.xp !== undefined) window.state.xp = data.xp;
                    if (data.streak) window.state.streak = data.streak;
                    if (data.track) window.setTrack(data.track);
                    window.updateUIStats();
                } else {
                    await window.saveUserProfileToCloud();
                }
            } catch (err) {
                console.error("Cloud load failed", err);
            }
        };
    </script>

